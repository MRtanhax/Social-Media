<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لینک‌های من</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&family=Great+Vibes&display=swap');

  :root{
    --deep: #2a0e46;
    --mid: #7b2d8e;
    --pink: #e0509a;
    --hotpink: #ff7ec2;
    --gold: #ffd98a;
    --card: rgba(255,255,255,0.09);
    --card-border: rgba(255,255,255,0.22);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    min-height:100vh;
    font-family:'Vazirmatn', sans-serif;
    background: radial-gradient(circle at 15% 10%, #5a1e78 0%, transparent 45%),
                radial-gradient(circle at 88% 20%, #ff7ec2 0%, transparent 35%),
                radial-gradient(circle at 80% 85%, #d63f9a 0%, transparent 50%),
                linear-gradient(160deg, var(--deep) 0%, var(--mid) 45%, var(--pink) 100%);
    background-attachment: fixed;
    color:#fff;
    overflow-x:hidden;
    position:relative;
  }

  /* twinkling stars */
  .star{
    position:fixed;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 6px 2px rgba(255,255,255,0.7);
    z-index:0;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; transform:scale(0.8); }
    50%{ opacity:1; transform:scale(1.3); }
  }

  /* floating petals */
  .petal{
    position: fixed;
    top:-10%;
    pointer-events:none;
    opacity:0.9;
    z-index:0;
    animation: fall linear infinite;
    filter: drop-shadow(0 0 6px rgba(255,214,236,0.4));
  }
  @keyframes fall{
    0%{ transform: translateY(-10vh) translateX(0) rotate(0deg); }
    50%{ transform: translateY(50vh) translateX(30px) rotate(180deg); }
    100%{ transform: translateY(110vh) translateX(-20px) rotate(360deg); }
  }

  .wrap{
    position:relative;
    z-index:2;
    max-width:480px;
    margin:0 auto;
    padding: 56px 24px 80px;
    text-align:center;
  }

  .avatar-wrap{
    position:relative;
    width:140px; height:140px;
    margin: 0 auto 22px;
  }
  .avatar{
    width:100%; height:100%;
    border-radius:50%;
    overflow:hidden;
    background: linear-gradient(145deg, #fff0f8, #ffd3ec);
    display:flex; align-items:center; justify-content:center;
    font-size:56px;
    box-shadow: 0 0 0 4px rgba(255,255,255,0.35), 0 0 40px rgba(255,126,194,0.55), 0 12px 40px rgba(0,0,0,0.35);
    position:relative;
    z-index:2;
    animation: glowPulse 3.5s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{ box-shadow: 0 0 0 4px rgba(255,255,255,0.35), 0 0 30px rgba(255,126,194,0.45), 0 12px 40px rgba(0,0,0,0.35); }
    50%{ box-shadow: 0 0 0 4px rgba(255,255,255,0.5), 0 0 55px rgba(255,217,138,0.7), 0 12px 40px rgba(0,0,0,0.35); }
  }
  .ring{
    position:absolute; inset:-12px;
    border-radius:50%;
    border:2px dashed rgba(255,217,138,0.65);
    animation: spin 18s linear infinite;
  }
  .ring2{
    position:absolute; inset:-22px;
    border-radius:50%;
    border:1px dotted rgba(255,255,255,0.35);
    animation: spin 26s linear infinite reverse;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .bloom{
    position:absolute;
    font-size:24px;
    animation: bloomPulse 3s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.5));
  }
  .bloom:nth-child(1){ top:-10px; right:2px; animation-delay:0s; }
  .bloom:nth-child(2){ bottom:-4px; left:-8px; animation-delay:1s; }
  .bloom:nth-child(3){ top:40%; left:-20px; animation-delay:2s; }
  .bloom:nth-child(4){ top:35%; right:-18px; animation-delay:1.5s; font-size:16px; }
  @keyframes bloomPulse{
    0%,100%{ transform: scale(0.85) rotate(0deg); opacity:0.75; }
    50%{ transform: scale(1.2) rotate(12deg); opacity:1; }
  }

  h1{
    font-family:'Great Vibes', 'Vazirmatn', cursive;
    font-size:40px;
    font-weight:400;
    margin: 4px 0 6px;
    background: linear-gradient(90deg, #fff, #ffd98a, #ff9fd6, #fff);
    background-size:200% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation: shimmer 4s linear infinite;
  }
  @keyframes shimmer{
    to{ background-position: -200% center; }
  }
  .subtitle{
    font-size:14.5px;
    color:#ffe6f4;
    opacity:0.85;
    margin-bottom:40px;
  }
  .subtitle i{ color: var(--gold); margin: 0 4px; }

  .links{
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .link-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:16px;
    padding:16px 20px;
    background: var(--card);
    border:1px solid var(--card-border);
    border-radius:20px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    text-decoration:none;
    color:#fff;
    overflow:hidden;
    transition: transform .25s ease, background .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .link-card:hover{
    transform: translateY(-4px) scale(1.02);
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,217,138,0.6);
    box-shadow: 0 14px 34px rgba(224,80,154,0.4), 0 0 24px rgba(255,217,138,0.25);
  }
  .link-card:hover .arrow{
    animation: petalSpin .6s ease;
    transform: translateX(-5px);
    opacity:1;
  }
  @keyframes petalSpin{
    0%{ transform: rotate(0deg) scale(1) translateX(-5px); }
    50%{ transform: rotate(180deg) scale(1.2) translateX(-5px); }
    100%{ transform: rotate(360deg) scale(1) translateX(-5px); }
  }

  .icon-box{
    flex-shrink:0;
    width:48px; height:48px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    font-size:21px;
    background: linear-gradient(145deg, rgba(255,255,255,0.28), rgba(255,255,255,0.06));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
  }
  .icon-box i{ color:#fff; }

  .txt{
    flex:1;
    text-align:right;
  }
  .txt .name{
    font-weight:600;
    font-size:15.5px;
    margin-bottom:2px;
  }
  .txt .handle{
    font-size:12.5px;
    color:#ffe6f4;
    opacity:0.7;
  }

  .arrow{
    font-size:16px;
    opacity:0.6;
    transition: transform .25s ease, opacity .25s ease;
    color: var(--gold);
  }

  .shine{
    position:absolute;
    top:0; left:-60%;
    width:40%; height:100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.28), transparent);
    transform: skewX(-20deg);
    transition: left .6s ease;
  }
  .link-card:hover .shine{ left:130%; }

  footer{
    margin-top:48px;
    font-size:12px;
    color:#ffd6ec;
    opacity:0.6;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  footer i{ color: var(--gold); font-size:11px; }

  #toast{
    position:fixed;
    bottom:32px;
    left:50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(60,20,70,0.92);
    border:1px solid rgba(255,214,236,0.4);
    color:#fff;
    padding:12px 22px;
    border-radius:30px;
    font-size:14px;
    font-family:'Vazirmatn', sans-serif;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;
    z-index:50;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
  }
  #toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }

  .link-card.pressing{
    transform: scale(0.96);
    background: rgba(255,255,255,0.22);
    box-shadow: 0 0 0 2px rgba(255,214,236,0.5);
  }
  .link-card .hint{
    position:absolute;
    bottom:5px;
    left:20px;
    font-size:10px;
    opacity:0.45;
    letter-spacing:0.2px;
  }

  @media (max-width:380px){
    h1{ font-size:32px; }
    .icon-box{ width:42px; height:42px; font-size:18px; }
  }
</style>
</head>

  const emojis = ['🌸','🌺','🌷','🌼','💮'];
  const count = 16;

  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const size = 14 + Math.random()*18;
    p.style.fontSize = size + 'px';
    p.style.left = Math.random()*100 + 'vw';
    const duration = 10 + Math.random()*12;
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = (Math.random()*duration) + 's';
    petalsContainer.appendChild(p);
  }

  const starsContainer = document.getElementById('stars');
  const starCount = 40;
  for(let i=0;i<starCount;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = 1 + Math.random()*2.5;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random()*100 + 'vw';
    s.style.top = Math.random()*100 + 'vh';
    s.style.animationDuration = (2 + Math.random()*3) + 's';
    s.style.animationDelay = (Math.random()*3) + 's';
    starsContainer.appendChild(s);
  }

  // ---- long-press to copy, tap/click to open ----
  const toast = document.getElementById('toast');
  let toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove('show'), 1800);
  }

  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(()=> showToast('لینک کپی شد 🌸'))
        .catch(()=> fallbackCopy(text));
    } else {
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); showToast('لینک کپی شد 🌸'); }
    catch(e){ showToast('کپی نشد 😔'); }
    document.body.removeChild(ta);
  }

  document.querySelectorAll('.link-card').forEach(card => {
    const url = card.getAttribute('href');
    if(!url || url === '#') return;

    // Copy-only cards: any click just copies, never navigates
    if(card.classList.contains('copy-only')){
      const copyVal = card.getAttribute('data-copy') || url;
      card.addEventListener('click', (e) => {
        e.preventDefault();
        if(navigator.vibrate) navigator.vibrate(30);
        copyText(copyVal);
      });
      return;
    }

    let pressTimer = null;
    let longPressed = false;
    const LONG_PRESS_MS = 500;

    const startPress = (e) => {
      longPressed = false;
      card.classList.add('pressing');
      pressTimer = setTimeout(() => {
        longPressed = true;
        card.classList.remove('pressing');
        if(navigator.vibrate) navigator.vibrate(30);
        copyText(url);
      }, LONG_PRESS_MS);
    };

    const cancelPress = () => {
      clearTimeout(pressTimer);
      card.classList.remove('pressing');
    };

    card.addEventListener('mousedown', startPress);
    card.addEventListener('touchstart', startPress, {passive:true});

    card.addEventListener('mouseup', cancelPress);
    card.addEventListener('mouseleave', cancelPress);
    card.addEventListener('touchend', cancelPress);
    card.addEventListener('touchcancel', cancelPress);

    card.addEventListener('click', (e) => {
      if(longPressed){
        e.preventDefault();
        longPressed = false;
      }
      // otherwise let the normal link navigation happen (opens in new tab)
    });

    // add a small hint element inside each card
    const hint = document.createElement('span');
    hint.className = 'hint';
    hint.textContent = 'نگه‌دار برای کپی';
    card.style.position = 'relative';
    card.appendChild(hint);
  });

  // hint for copy-only cards
  document.querySelectorAll('.link-card.copy-only').forEach(card => {
    const hint = document.createElement('span');
    hint.className = 'hint';
    hint.textContent = 'کلیک برای کپی';
    card.style.position = 'relative';
    card.appendChild(hint);
  });
</script>

</body>
</html>
